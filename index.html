<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progetto Team - Header & Navbar</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icone Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <!-- HEADER & NAVIGATION BAR -->
    <header class="main-header">
        <div class="header-container">
            <!-- Logo / Brand -->
            <a href="#" class="brand-logo">
                <span class="material-symbols-outlined logo-icon">groups</span>
                <span class="logo-text">Progetto<span class="highlight">Team</span></span>
            </a>

            <!-- Checkbox invisibile per il menu mobile senza JS -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle-checkbox">
            <label for="menu-toggle" class="menu-toggle-label" aria-label="Apri Menu">
                <span class="material-symbols-outlined menu-icon">menu</span>
                <span class="material-symbols-outlined close-icon">close</span>
            </label>

            <!-- Navigation Bar -->
            <nav class="navbar">
                <ul class="nav-links">
                    <li><a href="#home" class="nav-link active">Home</a></li>
                    <li><a href="#about" class="nav-link">Chi Siamo</a></li>
                    <li><a href="#services" class="nav-link">Servizi</a></li>
                    <li><a href="#portfolio" class="nav-link">Progetti</a></li>
                    <li><a href="#contact" class="nav-link">Contatti</a></li>
                </ul>

                <!-- Pulsanti d'azione (CTA) -->
                <div class="nav-actions">
                    <a href="#login" class="btn btn-secondary">Accedi</a>
                    <a href="#signup" class="btn btn-primary">Registrati</a>
                </div>
            </nav>
        </div>
    </header>

</body>
</html>
